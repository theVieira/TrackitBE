services:
  trackit-database:
    image: postgres
    container_name: trackit-database
    networks:
      - trackit-network
    ports:
      - 5432:5432
    volumes:
      - ./Docker/Volumes/trackit-database:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      
  trackit-backend:
    build: .
    container_name: trackit-backend
    networks:
      - trackit-network
    ports:
      - 8080:8080
    depends_on:
      - trackit-database
    volumes:
      - ./Uploads:/app/Uploads
      - ./logs:/app/logs
    environment:
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings_DefaultConnection=${CONNECTION_STRING}
          
networks:
  trackit-network:
    driver: bridge